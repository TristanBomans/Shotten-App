name: Deploy Push Worker

on:
  push:
    paths:
      - "workers/shotten-push/**"
      - ".github/workflows/deploy-push-worker.yml"
  workflow_dispatch:

concurrency:
  group: push-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/shotten-push
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Check deploy secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Install
        run: bun install --frozen-lockfile

      - name: Deploy
        run: bunx wrangler deploy

      - name: Attach cron trigger
        run: bunx wrangler triggers deploy --schedule "*/1 * * * *"
